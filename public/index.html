<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Style Of Life — Jewelry Lead Finder</title>
<style>
body{font-family:Inter,Arial,sans-serif;margin:0;background:#f7f7f5;color:#111}
.wrap{max-width:1100px;margin:40px auto;padding:0 18px}
.card{background:#fff;border:1px solid #ddd;border-radius:18px;padding:22px;margin:16px 0;box-shadow:0 6px 24px #0000000a}
h1{margin-bottom:6px}.muted{color:#666}
input,button{font:inherit;padding:12px 14px;border-radius:10px;border:1px solid #ccc}
input{width:280px}button{cursor:pointer;background:#111;color:#fff;border:0}
button.secondary{background:#eee;color:#111}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}
.score{font-size:28px;font-weight:800}.hot{color:#08783e}.medium{color:#9a6500}.skip{color:#b42318}
.reason{font-size:13px;color:#555;margin:5px 0}.wa{display:inline-block;margin-top:12px;padding:10px 14px;background:#111;color:white;text-decoration:none;border-radius:9px}
</style>
</head>
<body>
<div class="wrap">
<h1>Style Of Life — Jewelry Lead Finder</h1>
<p class="muted">Free MVP • Rule-based lead scoring • No paid AI API</p>

<div class="card">
  <input id="query" value="jewelry boutique" placeholder="Business type">
  <input id="location" value="USA" placeholder="Location">
  <button onclick="findLeads()">Find Leads</button>
  <p id="status" class="muted"></p>
</div>

<div id="results" class="grid"></div>
</div>

<script>
async function findLeads(){
  const q=document.getElementById('query').value.trim();
  const location=document.getElementById('location').value.trim();
  const status=document.getElementById('status');
  status.textContent='Searching demo lead source...';
  try{
    const r=await fetch(`/api/leads?q=${encodeURIComponent(q)}&location=${encodeURIComponent(location)}`);
    const data=await r.json();
    render(data.leads||[]);
    status.textContent=`Found ${data.leads?.length||0} leads.`;
  }catch(e){status.textContent='Backend not running. Run: npm install && npm start';}
}
function render(leads){
  document.getElementById('results').innerHTML=leads.map(x=>{
    const cls=x.score>=80?'hot':x.score>=60?'medium':'skip';
    const msg=`Hi ${x.name}, I came across your jewelry business and thought our collection could be a good fit. We offer premium jewelry for boutiques and retailers. Would you be open to seeing our collection?`;
    const wa='https://wa.me/916352925472?text='+encodeURIComponent(msg);
    return `<div class="card">
      <h2>${esc(x.name)}</h2><div class="muted">${esc(x.location)}</div>
      <div class="score ${cls}">${x.score}/100</div>
      <b>${x.priority}</b>
      <div style="margin-top:12px">${x.reasons.map(r=>`<div class="reason">✓ ${esc(r)}</div>`).join('')}</div>
      <a class="wa" target="_blank" rel="noopener" href="${wa}">Open WhatsApp</a>
    </div>`;
  }).join('');
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
findLeads();
</script>
</body>
</html>
