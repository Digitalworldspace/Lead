<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Style Of Life — Smart Shopping</title>
<meta name="description" content="Compare live eBay listings with Style Of Life smart shopping recommendations.">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#fff;color:#111}
header{border-bottom:1px solid #eee;position:sticky;top:0;background:#fff;z-index:5}
.nav{max-width:1180px;margin:auto;padding:20px;display:flex;justify-content:space-between}.brand{font-size:22px;font-weight:800;letter-spacing:.5px}.pill{font-size:12px;padding:8px 12px;border:1px solid #ddd;border-radius:999px}
main{max-width:1180px;margin:auto;padding:58px 20px 80px}.hero{text-align:center;max-width:820px;margin:auto}
h1{font-size:clamp(38px,6vw,68px);line-height:1.02;margin:0 0 18px;letter-spacing:-2px}.sub{font-size:18px;color:#666;line-height:1.6}
.search{display:flex;gap:10px;margin:28px auto;max-width:760px}input{flex:1;padding:18px 20px;border:1px solid #ccc;border-radius:14px;font-size:16px}
button{border:0;background:#111;color:#fff;border-radius:14px;padding:0 25px;font-weight:700;cursor:pointer}button:disabled{opacity:.55}
#status{text-align:center;margin:20px 0;min-height:24px;color:#666}.grid,.all{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.card{border:1px solid #e7e7e7;border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 5px 20px rgba(0,0,0,.04)}
.card img{width:100%;height:210px;object-fit:contain;background:#fafafa}.body{padding:16px}.badge{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;margin-bottom:9px}
.title{font-weight:700;line-height:1.35;min-height:58px}.price{font-size:22px;font-weight:800;margin:12px 0}.meta{font-size:13px;color:#666;line-height:1.6}
.view{display:block;text-align:center;background:#111;color:#fff;text-decoration:none;padding:12px;border-radius:10px;margin-top:14px;font-weight:700}
.results{margin-top:48px}.results h2{font-size:28px}.error{padding:18px;border:1px solid #f0caca;background:#fff8f8;border-radius:14px;color:#8a2222}
@media(max-width:900px){.grid,.all{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.search{flex-direction:column}.search button{height:52px}.grid,.all{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="nav"><div class="brand">STYLE OF LIFE</div><div class="pill">Smart Shopping</div></div></header>
<main>
<section class="hero">
<h1>Find the product worth buying.</h1>
<div class="sub">Search naturally. We compare live eBay listings and surface useful picks based on relevance, price and seller signals.</div>
<form class="search" id="form"><input id="q" placeholder="Try: best moissanite bracelet under $500"><button id="btn">Search</button></form>
</section>
<div id="status"></div>
<section id="recommendations" class="grid"></section>
<section id="more" class="results" hidden><h2>More results</h2><div id="all" class="all"></div></section>
</main>
<script>
const $=id=>document.getElementById(id);
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function money(x){if(x.price==null)return"Price unavailable";try{return new Intl.NumberFormat("en-US",{style:"currency",currency:x.currency||"USD"}).format(Number(x.price))}catch{return`${x.currency||""} ${x.price}`}}
function card(x,badge=""){if(!x)return"";return`<article class="card">${x.image?`<img src="${esc(x.image)}" alt="${esc(x.title)}" loading="lazy">`:""}<div class="body">${badge?`<div class="badge">${esc(badge)}</div>`:""}<div class="title">${esc(x.title)}</div><div class="price">${money(x)}</div><div class="meta">${esc(x.condition||"")}<br>${x.seller?.feedbackPercentage!=null?`Seller ${esc(x.seller.feedbackPercentage)}% positive`:""}</div><a class="view" href="${esc(x.affiliateUrl)}" target="_blank" rel="sponsored nofollow noopener">View on eBay</a></div></article>`}
$("form").addEventListener("submit",async e=>{e.preventDefault();const q=$("q").value.trim();if(!q)return;$("btn").disabled=true;$("status").textContent="Searching live eBay listings…";$("recommendations").innerHTML="";$("all").innerHTML="";$("more").hidden=true;try{const r=await fetch("/api/search?q="+encodeURIComponent(q)),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||"Search failed");$("recommendations").innerHTML=card(d.recommendations.bestOverall,"🏆 Best Overall")+card(d.recommendations.bestValue,"💰 Best Value")+card(d.recommendations.bestRated,"⭐ Best Rated")+card(d.recommendations.premium,"👑 Premium Pick");const seen=new Set();const items=d.items.filter(x=>x.id&&!seen.has(x.id)&&(seen.add(x.id),true));$("all").innerHTML=items.map(x=>card(x)).join("");$("more").hidden=!items.length;$("status").textContent=`${d.total||items.length} live eBay matches found.`}catch(e){$("status").innerHTML=`<div class="error">${esc(e.message)}</div>`}finally{$("btn").disabled=false}});
</script>
</body>
</html>
