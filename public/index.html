<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Style Of Life — Amazon Link Portal</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f6f2;color:#111;font-family:Arial,sans-serif}
header{background:#111;color:#fff;padding:20px 6%;display:flex;justify-content:space-between}.logo{font:25px Georgia,serif}.small{font-size:10px;letter-spacing:.15em;opacity:.7}
main{max-width:1150px;margin:auto;padding:35px 20px}.panel,.card{background:#fff;border:1px solid #e5e1d9;border-radius:18px;padding:22px;margin-bottom:20px}
h1{font:42px Georgia,serif;margin:0 0 8px}h2{font:25px Georgia,serif;margin:0 0 18px}.muted{font-size:13px;color:#777}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-size:11px;font-weight:700;display:block;margin:10px 0 6px}input,textarea,select{width:100%;padding:11px;border:1px solid #d8d4cc;border-radius:10px}textarea{min-height:90px}
button{background:#111;color:#fff;border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;margin-top:15px}.danger{background:#8a2525}.hide{background:#666}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.card{display:grid;grid-template-columns:120px 1fr auto;gap:16px}.pic{width:120px;height:120px;background:#f2f1ed;border-radius:12px;object-fit:contain}.badge{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#777}.title{font:20px Georgia,serif;margin:7px 0}.price{font-weight:700}.advantages{font-size:13px;color:#666;line-height:1.6;margin-top:8px}.actions button{display:block;width:100%}
#status{margin-top:12px;color:#777;font-size:13px}
@media(max-width:800px){.grid,.cards{grid-template-columns:1fr}.card{grid-template-columns:90px 1fr}.pic{width:90px;height:90px}.actions{grid-column:1/-1}}
</style></head>
<body>
<header><div class="logo">Style Of Life</div><div class="small">AMAZON LINK PORTAL · SUPABASE</div></header>
<main>
<h1>Amazon Product Portal</h1>
<p class="muted">Add your Amazon product link once. Supabase stores it and the separate frontend can display active products.</p>

<div class="panel">
<h2>Add Amazon Product</h2>
<label>ADMIN TOKEN *</label><input id="token" type="password" placeholder="Your backend ADMIN_TOKEN">
<form id="form">
<div class="grid">
<div><label>AMAZON LINK *</label><input id="amazonUrl" required placeholder="https://www.amazon.com/dp/B0XXXXXXXXX"></div>
<div><label>PRODUCT TITLE</label><input id="title" placeholder="Moissanite Tennis Bracelet"></div>
<div><label>PRICE</label><input id="price" placeholder="$299.99"></div>
<div><label>IMAGE URL</label><input id="imageUrl" placeholder="https://..."></div>
<div><label>BADGE</label><select id="badge"><option>Best Overall</option><option>Best Value</option><option>Best Rated</option><option>Premium Pick</option><option>Style Of Life Pick</option></select></div>
<div><label>STATUS</label><select id="active"><option value="true">Show on frontend</option><option value="false">Hide from frontend</option></select></div>
</div>
<label>CUSTOMER ADVANTAGES — one per line</label>
<textarea id="advantages" placeholder="Elegant everyday style&#10;Great anniversary gift&#10;Premium look"></textarea>
<button>Add Product to Supabase</button><span id="status"></span>
</form></div>

<h2>Saved Products</h2><div class="cards" id="list"></div>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
async function load(){
 const t=$("token").value; if(!t){$("list").innerHTML='<p class="muted">Enter ADMIN TOKEN to manage products.</p>';return}
 const r=await fetch("/api/products?admin=1",{headers:{"x-admin-token":t}}),d=await r.json();
 if(!r.ok){$("list").innerHTML=`<p class="muted">${esc(d.error)}</p>`;return}
 $("list").innerHTML=(d.products||[]).map(p=>`<article class="card">
 ${p.image_url?`<img class="pic" src="${esc(p.image_url)}">`:`<div class="pic"></div>`}
 <div><div class="badge">${esc(p.badge)} · ${p.active?"LIVE":"HIDDEN"}</div><div class="title">${esc(p.title)}</div><div class="price">${esc(p.price||"See Amazon")}</div><div class="advantages">${(p.advantages||[]).map(x=>"✓ "+esc(x)).join("<br>")}</div><div class="muted">ASIN: ${esc(p.asin||"")}</div></div>
 <div class="actions"><button class="hide" onclick="toggleP('${p.id}',${!p.active})">${p.active?"Hide":"Show"}</button><button class="danger" onclick="delP('${p.id}')">Delete</button></div></article>`).join("")||'<p class="muted">No products saved.</p>';
}
$("token").onchange=load;
$("form").onsubmit=async e=>{e.preventDefault();$("status").textContent=" Saving…";const r=await fetch("/api/products",{method:"POST",headers:{"Content-Type":"application/json","x-admin-token":$("token").value},body:JSON.stringify({amazonUrl:$("amazonUrl").value,title:$("title").value,price:$("price").value,imageUrl:$("imageUrl").value,badge:$("badge").value,active:$("active").value==="true",advantages:$("advantages").value.split("\\n").map(x=>x.trim()).filter(Boolean)})});const d=await r.json();$("status").textContent=r.ok?" Added to Supabase.":" "+(d.error||"Error");if(r.ok){e.target.reset();load()}};
async function toggleP(id,active){await fetch("/api/products/"+id,{method:"PATCH",headers:{"Content-Type":"application/json","x-admin-token":$("token").value},body:JSON.stringify({active})});load()}
async function delP(id){if(!confirm("Delete product?"))return;await fetch("/api/products/"+id,{method:"DELETE",headers:{"x-admin-token":$("token").value}});load()}
</script></body></html>
