<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Style Of Life — Smart Shopping</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif}
header{padding:25px 6%;border-bottom:1px solid #eee}.brand{font-size:25px;font-weight:800}.small{font-size:12px;color:#777;margin-top:3px}
main{max-width:1180px;margin:auto;padding:55px 20px}.hero{text-align:center;max-width:900px;margin:auto}
h1{font-size:clamp(40px,6vw,70px);line-height:1;margin:0 0 18px;letter-spacing:-2px}
p{color:#666;font-size:18px}.search{display:flex;gap:10px;margin:30px auto;max-width:800px}
input{flex:1;padding:18px;border:1px solid #ddd;border-radius:13px;font-size:16px}button{padding:0 25px;border:0;border-radius:13px;background:#111;color:#fff;font-weight:700;font-size:15px;cursor:pointer}
#status{text-align:center;color:#666;min-height:25px;margin:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}
.card{border:1px solid #e8e8e8;border-radius:18px;overflow:hidden;display:flex;flex-direction:column;min-height:450px}
.pic{height:255px;background:#f7f7f7;display:flex;align-items:center;justify-content:center}.pic img{width:100%;height:100%;object-fit:contain}
.body{padding:17px;display:flex;flex-direction:column;flex:1}.badge{font-size:12px;font-weight:800;margin-bottom:8px}.title{font-weight:600;line-height:1.4}.meta{font-size:13px;color:#666;margin:12px 0}.price{font-size:22px;font-weight:800;margin-bottom:15px}.buy{margin-top:auto;background:#111;color:#fff;text-decoration:none;text-align:center;padding:12px;border-radius:10px;font-weight:700}
.note{text-align:center;font-size:12px;color:#888;margin:30px}
@media(max-width:600px){.search{flex-direction:column}.search button{height:52px}}
</style>
</head>
<body>
<header><div class="brand">Style Of Life</div><div class="small">Smart Shopping</div></header>
<main>
<div class="hero">
<h1>Find the best product.</h1>
<p>Search Amazon and see the strongest matches ranked for you.</p>
<form id="form" class="search"><input id="q" placeholder="e.g. moissanite bracelet under $500" required><button>Search</button></form>
</div>
<div id="status"></div><div id="grid" class="grid"></div>
<div class="note">Amazon prices and availability can change. Qualifying purchases may earn Style Of Life a commission.</div>
</main>
<script>
const $=id=>document.getElementById(id);
$("form").addEventListener("submit",async e=>{
 e.preventDefault(); const q=$("q").value.trim(); if(!q)return;
 $("status").textContent="Finding best products…"; $("grid").innerHTML="";
 try{
  const r=await fetch("/api/search?q="+encodeURIComponent(q),{headers:{"Accept":"application/json"}});
  const text=await r.text();
  let d; try{d=JSON.parse(text)}catch{throw new Error("Backend is not running. Open the Vercel deployment URL, not GitHub Pages.");}
  if(!r.ok)throw new Error(d.error||"Search failed");
  if(!d.products?.length){$("status").textContent="No products found. Try another search.";return;}
  $("status").textContent=d.products.length+" best matches found";
  $("grid").innerHTML=d.products.map(p=>`
   <article class="card">
    <div class="pic">${p.image?`<img src="${esc(p.image)}" alt="${esc(p.title)}">`:""}</div>
    <div class="body">
     <div class="badge">${esc(p.badge)}</div>
     <div class="title">${esc(p.title)}</div>
     <div class="meta">${p.rating?`★ ${p.rating.toFixed(1)}`:""}${p.reviews?` · ${p.reviews.toLocaleString()} reviews`:""}</div>
     <div class="price">${p.price!=null?"$"+p.price.toFixed(2):"See Amazon price"}</div>
     <a class="buy" href="${esc(p.url)}" target="_blank" rel="sponsored nofollow noopener">View on Amazon</a>
    </div>
   </article>`).join("");
 }catch(err){$("status").textContent=err.message}
});
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
</script>
</body>
</html>
