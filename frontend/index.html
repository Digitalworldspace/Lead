<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Style Of Life</title><style>body{margin:0;font-family:Arial;color:#111}header{text-align:center;padding:35px;border-bottom:1px solid #eee}main{max-width:1200px;margin:30px auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px}.card{border:1px solid #eee;border-radius:16px;overflow:hidden}.pic{width:100%;height:260px;object-fit:cover;background:#f5f5f5}.info{padding:18px}.title{font-weight:700;font-size:18px}.price{margin:10px 0}.desc{color:#666;line-height:1.5}.btn{display:block;background:#111;color:#fff;text-decoration:none;text-align:center;padding:13px;border-radius:9px;margin-top:15px}</style></head><body><header><h1>Style Of Life</h1><div>Curated products you'll love</div></header><main><div id="grid" class="grid"></div><div id="empty"></div></main><script>const e=v=>String(v||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));fetch("/api/products").then(r=>r.json()).then(a=>{if(!a.length){empty.textContent="No products available yet.";return}grid.innerHTML=a.map(p=>`<article class="card">${p.image_url?`<img class="pic" src="${e(p.image_url)}">`:`<div class="pic"></div>`}<div class="info"><div class="title">${e(p.title)}</div>${p.price?`<div class="price">${e(p.price)}</div>`:""}${p.description?`<div class="desc">${e(p.description)}</div>`:""}<a class="btn" href="${e(p.affiliate_url)}" target="_blank" rel="nofollow sponsored noopener">Shop Now</a></div></article>`).join("")}).catch(()=>empty.textContent="Unable to load products.")</script></body></html>
