<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Style Of Life — Curated Amazon Picks</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#111;background:#fff}
header{padding:22px 6%;border-bottom:1px solid #eee;display:flex;justify-content:space-between}.brand{font-weight:800;letter-spacing:.6px}
header a{color:#777;text-decoration:none;font-size:13px}.hero{text-align:center;padding:70px 6% 42px;background:#fafafa}
.hero small{letter-spacing:2px;text-transform:uppercase;color:#777}.hero h1{font-size:clamp(38px,6vw,70px);margin:15px 0}.hero p{max-width:650px;margin:auto;color:#666;line-height:1.6}
main{padding:30px 6% 70px}.status{text-align:center;color:#777;padding:30px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px}
.card{border:1px solid #e8e8e8;border-radius:20px;overflow:hidden;display:flex;flex-direction:column}.image{aspect-ratio:1;background:#f7f7f7;display:flex;align-items:center;justify-content:center}.image img{width:100%;height:100%;object-fit:cover}
.content{padding:20px;display:flex;flex-direction:column;flex:1}.badge{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#777;margin-bottom:9px}.title{font-weight:700;font-size:19px;line-height:1.35}.price{font-weight:800;margin:10px 0}ul{padding-left:18px;color:#555;font-size:14px;line-height:1.5}
.btn{margin-top:auto;background:#111;color:#fff;text-decoration:none;text-align:center;padding:13px;border-radius:999px;font-weight:700}footer{text-align:center;border-top:1px solid #eee;padding:25px;color:#888;font-size:13px}.empty{text-align:center;padding:70px;color:#777}
</style></head>
<body>
<header><div class="brand">STYLE OF LIFE</div><a href="/admin">Admin</a></header>
<section class="hero"><small>Curated for you</small><h1>Shop our latest picks.</h1><p>Discover products selected by Style Of Life, with clear advantages and a simple way to shop on Amazon.</p></section>
<main><div id="status" class="status">Loading products...</div><div id="grid" class="grid"></div></main>
<footer>Style Of Life · Product links may be affiliate links.</footer>
<script>
const esc=x=>String(x??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
async function load(){
 try{
  const r=await fetch("/api/products"),d=await r.json(); if(!r.ok)throw Error(d.error||"Unable to load products.");
  document.getElementById("status").style.display="none";
  const p=d.products||[],g=document.getElementById("grid");
  if(!p.length){g.innerHTML='<div class="empty">Products will appear here soon.</div>';return;}
  g.innerHTML=p.map(x=>`<article class="card"><div class="image">${x.image_url?`<img src="${esc(x.image_url)}" alt="${esc(x.title)}" loading="lazy">`:"No image"}</div><div class="content"><div class="badge">${esc(x.badge||"Style Of Life Pick")}</div><div class="title">${esc(x.title)}</div><div class="price">${esc(x.price||"")}</div>${(x.advantages||[]).length?`<ul>${x.advantages.map(a=>`<li>${esc(a)}</li>`).join("")}</ul>`:""}<a class="btn" href="${esc(x.affiliate_url)}" target="_blank" rel="noopener sponsored">Shop on Amazon</a></div></article>`).join("");
 }catch(e){document.getElementById("status").textContent=e.message;}
}
load();
</script></body></html>
