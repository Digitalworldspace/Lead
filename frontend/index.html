<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Style Of Life — Amazon Picks</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#111;font-family:Arial,sans-serif}.nav{height:74px;border-bottom:1px solid #e9e5de;display:flex;align-items:center;justify-content:space-between;padding:0 6%}.logo{font:27px Georgia,serif}.nav span{font-size:13px;color:#777}.hero{text-align:center;padding:78px 20px 55px}.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#777}.hero h1{font:400 clamp(43px,6vw,72px)/1.05 Georgia,serif;margin:18px auto;max-width:850px}.hero p{color:#777;max-width:650px;margin:auto;line-height:1.7}.wrap{max-width:1180px;margin:auto;padding:10px 24px 70px}.status{font-size:13px;color:#777;margin:0 0 18px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.card{border:1px solid #e6e2db;border-radius:18px;overflow:hidden;background:#fff;display:flex;flex-direction:column}.pic{aspect-ratio:1;background:#f7f6f2}.pic img{width:100%;height:100%;object-fit:contain}.body{padding:18px}.badge{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#777}.title{font:19px/1.35 Georgia,serif;margin:9px 0}.price{font-weight:800;margin:12px 0}.adv{font-size:13px;color:#666;line-height:1.7;min-height:64px}.buy{display:block;background:#111;color:#fff;text-decoration:none;text-align:center;border-radius:11px;padding:13px;margin-top:16px;font-weight:700}.empty{text-align:center;border:1px dashed #ccc;border-radius:18px;padding:50px;color:#777}@media(max-width:950px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.nav span{display:none}.grid{grid-template-columns:1fr}.hero{padding-top:55px}}
</style></head><body><nav class="nav"><div class="logo">Style Of Life</div><span>Curated Amazon Picks</span></nav><section class="hero"><div class="eyebrow">Style Of Life</div><h1>Beautiful finds, selected for you.</h1><p>Browse products added by Style Of Life. The collection updates automatically when new products are added in the private product portal.</p></section><main class="wrap"><div id="status" class="status">Loading picks…</div><div id="grid" class="grid"></div></main><script>
const grid=document.getElementById('grid'),status=document.getElementById('status');const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
async function load(){try{const r=await fetch('/api/products');const d=await r.json();if(!r.ok)throw Error(d.error||'Could not load products');let a=d.products||[];a=a.sort(()=>Math.random()-.5);status.textContent=a.length?`${a.length} curated picks`:'No products added yet.';if(!a.length){grid.innerHTML='<div class="empty">Products added in the Style Of Life portal will appear here.</div>';return}grid.innerHTML=a.map(p=>`<article class="card"><div class="pic">${p.image_url?`<img src="${esc(p.image_url)}" alt="${esc(p.title)}">`:''}</div><div class="body"><div class="badge">${esc(p.badge)}</div><div class="title">${esc(p.title)}</div><div class="price">${esc(p.price||'See Amazon')}</div><div class="adv">${(p.advantages||[]).map(x=>'✓ '+esc(x)).join('<br>')}</div><a class="buy" href="${esc(p.affiliate_url)}" target="_blank" rel="sponsored noopener">Shop on Amazon</a></div></article>`).join('')}catch(e){status.textContent='Unable to load products right now.';grid.innerHTML=`<div class="empty">${esc(e.message)}</div>`}}load();
</script></body></html>
