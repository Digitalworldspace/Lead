<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Style Of Life — Affiliate Products</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#111;font-family:Inter,Arial,sans-serif}
header{padding:55px 20px;text-align:center;border-bottom:1px solid #eee}
h1{font-size:44px;margin:0 0 10px;letter-spacing:-1px}.sub{color:#666}
.wrap{max-width:1200px;margin:40px auto;padding:0 20px}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:24px}
.card{border:1px solid #e8e8e8;border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 8px 30px rgba(0,0,0,.05)}
.card img{width:100%;height:260px;object-fit:cover;background:#f4f4f4}.body{padding:18px}
h2{font-size:20px;margin:0 0 8px}.price{font-weight:800;font-size:18px;margin:8px 0}.desc{color:#666;line-height:1.5;min-height:45px}
.shop{display:block;text-align:center;text-decoration:none;background:#111;color:#fff;border-radius:10px;padding:13px;margin-top:16px;font-weight:700}
.state{text-align:center;color:#666;padding:40px}
</style>
</head>
<body>
<header>
  <h1>Style Of Life</h1>
  <div class="sub">Featured Products & Offers</div>
</header>
<div class="wrap">
  <div id="products" class="products"><div class="state">Loading products...</div></div>
</div>
<script>
async function load(){
  const box=document.getElementById("products");
  try{
    const r=await fetch("/api/products");
    const text=await r.text();
    let d;try{d=JSON.parse(text)}catch{throw new Error("API returned a non-JSON response")}
    if(!r.ok)throw new Error(d.error||"Could not load products");
    const items=d.products||[];
    if(!items.length){box.innerHTML='<div class="state">No products available yet.</div>';return}
    box.innerHTML=items.map(p=>`
      <article class="card">
        ${p.image_url?`<img src="${esc(p.image_url)}" alt="${esc(p.title)}">`:`<div style="height:260px;background:#f4f4f4;display:grid;place-items:center;color:#777">No image</div>`}
        <div class="body">
          <h2>${esc(p.title)}</h2>
          ${p.price?`<div class="price">${esc(p.price)}</div>`:""}
          <div class="desc">${esc(p.description||"")}</div>
          <a class="shop" href="${esc(p.affiliate_url)}" target="_blank" rel="nofollow sponsored noopener">Shop Now</a>
        </div>
      </article>`).join("");
  }catch(e){box.innerHTML='<div class="state">'+esc(e.message)+'</div>'}
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
load();
</script>
</body>
</html>
