<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Style Of Life</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#fff;color:#111}header{padding:34px 7%;border-bottom:1px solid #eee;text-align:center}h1{margin:0;font-size:32px}.sub{margin-top:8px;color:#666}main{max-width:1200px;margin:35px auto;padding:0 20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px}.card{border:1px solid #eee;border-radius:16px;overflow:hidden;box-shadow:0 5px 20px #0000000b}.photo{width:100%;height:260px;object-fit:cover;background:#f5f5f5}.info{padding:18px}.title{font-size:18px;font-weight:700}.price{font-size:17px;margin:10px 0}.desc{color:#666;line-height:1.5;min-height:45px}.btn{display:block;text-align:center;background:#111;color:#fff;text-decoration:none;padding:13px;border-radius:10px;margin-top:16px}.empty{text-align:center;padding:70px;color:#777}</style></head><body><header><h1>Style Of Life</h1><div class="sub">Curated products you'll love</div></header><main><div id="grid" class="grid"></div><div id="empty" class="empty" style="display:none">No products available yet.</div></main><script>async function load(){const g=document.getElementById("grid"),e=document.getElementById("empty");try{const r=await fetch("/api/products"),p=await r.json();if(!p.length){e.style.display="block";return}g.innerHTML=p.map(x=>'<article class="card">'+(x.image_url?'<img class="photo" src="'+esc(x.image_url)+'" alt="'+esc(x.title)+'">':'<div class="photo"></div>')+'<div class="info"><div class="title">'+esc(x.title)+'</div>'+(x.price?'<div class="price">'+esc(x.price)+'</div>':'')+(x.description?'<div class="desc">'+esc(x.description)+'</div>':'')+'<a class="btn" href="'+esc(x.affiliate_url)+'" target="_blank" rel="nofollow sponsored noopener">Shop Now</a></div></article>').join("")}catch(_){e.style.display="block";e.textContent="Unable to load products."}}function esc(v){return String(v||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}load();</script></body></html>
