<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Style Of Life — Affiliate Product Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f7f7;color:#111;font-family:Inter,Arial,sans-serif}
.wrap{max-width:1100px;margin:35px auto;padding:0 18px}
.card{background:#fff;border:1px solid #e7e7e7;border-radius:18px;padding:28px;margin-bottom:22px;box-shadow:0 8px 30px rgba(0,0,0,.04)}
h1{margin:0 0 24px;font-size:32px}h2{margin:0 0 20px;font-size:24px}
label{display:block;font-weight:700;margin:14px 0 7px}
input,textarea{width:100%;border:1px solid #ccc;border-radius:10px;padding:13px;font-size:15px;background:#fff}
textarea{min-height:100px;resize:vertical}
button{border:0;border-radius:10px;padding:12px 17px;background:#111;color:#fff;font-weight:700;cursor:pointer}
button.secondary{background:#eee;color:#111}button.danger{background:#b42318}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.full{grid-column:1/-1}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.msg{padding:12px 14px;border-radius:10px;margin-top:14px;display:none;white-space:pre-wrap}
.msg.ok{display:block;background:#e9f8ef;color:#146c36}.msg.err{display:block;background:#fff0f0;color:#a51d2d}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.product{border:1px solid #e5e5e5;border-radius:14px;overflow:hidden;background:#fff}
.product img{width:100%;height:210px;object-fit:cover;background:#f3f3f3}
.product .body{padding:14px}.product h3{margin:0 0 7px;font-size:18px}.muted{color:#666;font-size:14px}
@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Affiliate Product Admin</h1>
    <label>Admin Token</label>
    <input id="token" type="password" placeholder="Enter your ADMIN_TOKEN">
    <div class="actions">
      <button id="connect">Connect / Load Products</button>
    </div>
    <div id="message" class="msg"></div>
  </div>

  <div class="card">
    <h2>Add Product</h2>
    <form id="form">
      <div class="grid">
        <div>
          <label>Product Name *</label>
          <input id="title" required placeholder="Product name">
        </div>
        <div>
          <label>Price</label>
          <input id="price" placeholder="$49.99">
        </div>
        <div class="full">
          <label>Product Image URL</label>
          <input id="image_url" type="url" placeholder="https://...">
        </div>
        <div class="full">
          <label>Short Description / Benefits</label>
          <textarea id="description" placeholder="Short product description or benefits"></textarea>
        </div>
        <div class="full">
          <label>Affiliate Link *</label>
          <input id="affiliate_url" type="url" required placeholder="https://...">
        </div>
      </div>
      <div class="actions">
        <button type="submit">Add Product</button>
        <button type="button" class="secondary" id="clear">Clear</button>
      </div>
    </form>
  </div>

  <div class="card">
    <h2>Products</h2>
    <div id="products" class="products"></div>
  </div>
</div>

<script>
const API="/api";
const $=id=>document.getElementById(id);
function token(){return $("token").value.trim()}
function show(text,ok=false){
  const m=$("message");m.textContent=text;m.className="msg "+(ok?"ok":"err");
}
async function api(path,options={}){
  const headers={"Content-Type":"application/json","x-admin-token":token(),...(options.headers||{})};
  const r=await fetch(API+path,{...options,headers});
  const text=await r.text();
  let data;
  try{data=JSON.parse(text)}catch{throw new Error("Server returned non-JSON response (HTTP "+r.status+").")}
  if(!r.ok) throw new Error(data.error||("HTTP "+r.status));
  return data;
}
function render(items){
  $("products").innerHTML=items.length?items.map(p=>`
    <div class="product">
      ${p.image_url?`<img src="${escapeHtml(p.image_url)}" alt="">`:`<div style="height:210px;background:#f1f1f1;display:grid;place-items:center;color:#777">No image</div>`}
      <div class="body">
        <h3>${escapeHtml(p.title)}</h3>
        <div class="muted">${escapeHtml(p.price||"")}</div>
        <p>${escapeHtml(p.description||"")}</p>
        <div class="muted">Status: ${p.active?"Active":"Inactive"}</div>
        <div class="actions">
          <button class="danger" onclick="removeProduct('${p.id}')">Delete</button>
        </div>
      </div>
    </div>`).join(""):"<p class='muted'>No products yet.</p>";
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}
async function load(){
  try{
    const d=await api("/admin/products");
    render(d.products||[]);
    show("Connected successfully.",true);
  }catch(e){show(e.message)}
}
$("connect").onclick=load;
$("clear").onclick=()=>{$("form").reset()};
$("form").onsubmit=async e=>{
  e.preventDefault();
  try{
    const d=await api("/admin/products",{method:"POST",body:JSON.stringify({
      title:$("title").value,
      price:$("price").value,
      image_url:$("image_url").value,
      description:$("description").value,
      affiliate_url:$("affiliate_url").value,
      active:true
    })});
    $("form").reset();
    show("Product added successfully.",true);
    await load();
  }catch(e){show(e.message)}
};
async function removeProduct(id){
  if(!confirm("Delete this product?"))return;
  try{await api("/admin/products/"+encodeURIComponent(id),{method:"DELETE"});show("Product deleted.",true);await load()}
  catch(e){show(e.message)}
}
</script>
</body>
</html>
