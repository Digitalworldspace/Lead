<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Style Of Life — Product Portal</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f5f1;color:#111;font-family:Arial,sans-serif}.head{background:#111;color:#fff;padding:22px 6%;font:26px Georgia,serif}.wrap{max-width:1100px;margin:auto;padding:30px 20px}.box,.item{background:#fff;border:1px solid #e3dfd7;border-radius:18px;padding:22px;margin-bottom:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}label{display:block;font-size:11px;font-weight:700;margin:10px 0 5px}input,textarea,select{width:100%;padding:12px;border:1px solid #d5d1c9;border-radius:9px;font:inherit}textarea{min-height:90px}button{background:#111;color:#fff;border:0;border-radius:9px;padding:12px 18px;margin-top:15px;font-weight:700;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.danger{background:#8b2222}.status{margin:12px 0;font-size:13px}.ok{color:#17683e}.err{color:#a11}.muted{color:#777;font-size:13px}.items{display:grid;grid-template-columns:1fr 1fr;gap:15px}.item{display:grid;grid-template-columns:105px 1fr;gap:15px}.pic{width:105px;height:105px;border-radius:10px;background:#f0eee9;object-fit:contain}.badge{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#777}.title{font:20px Georgia,serif;margin:7px 0}@media(max-width:760px){.grid,.items{grid-template-columns:1fr}}
</style></head><body><div class="head">Style Of Life — Amazon Product Portal</div><div class="wrap"><div class="box"><h2>Connect & Add Products</h2><label>ADMIN TOKEN</label><input id="token" type="password" autocomplete="off" placeholder="Your ADMIN_TOKEN"><button id="connect" type="button">Connect</button><div id="status" class="status muted">Enter your admin token and click Connect.</div><form id="form" style="display:none"><div class="grid"><div><label>AMAZON.COM PRODUCT LINK *</label><input id="url" required placeholder="https://www.amazon.com/dp/B0XXXXXXXX"></div><div><label>TITLE</label><input id="title" placeholder="Product title"></div><div><label>PRICE</label><input id="price" placeholder="$299"></div><div><label>IMAGE URL</label><input id="image" placeholder="https://..."></div><div><label>BADGE</label><select id="badge"><option>Best Overall</option><option>Best Value</option><option>Best Rated</option><option>Premium Pick</option><option>Style Of Life Pick</option></select></div></div><label>CUSTOMER ADVANTAGES — ONE PER LINE</label><textarea id="advantages" placeholder="Elegant everyday style&#10;Great gift choice&#10;Lightweight design"></textarea><button id="add" type="submit">Add Product</button></form></div><div id="items" class="items"></div></div><script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));let token=localStorage.getItem('sol_admin_token')||'';$('token').value=token;
function H(){return {'x-admin-token':$('token').value}}async function api(path,opt={}){const r=await fetch(path,{...opt,headers:{...H(),...(opt.headers||{})}});const d=await r.json().catch(()=>({error:'Invalid server response'}));if(!r.ok)throw Error(d.error||`Server error ${r.status}`);return d}
async function load(){try{const d=await api('/api/admin/products');$('form').style.display='block';$('status').className='status ok';$('status').textContent=`Connected. ${d.products?.length||0} products in Supabase.`;$('items').innerHTML=(d.products||[]).map(p=>`<div class="item">${p.image_url?`<img class="pic" src="${esc(p.image_url)}">`:'<div class="pic"></div>'}<div><div class="badge">${esc(p.badge)} · ${p.active?'LIVE':'HIDDEN'}</div><div class="title">${esc(p.title)}</div><div>${esc(p.price)}</div><div class="muted">${(p.advantages||[]).map(x=>'✓ '+esc(x)).join('<br>')}</div><button type="button" onclick="toggle('${p.id}',${!p.active})">${p.active?'Hide':'Show'}</button> <button type="button" class="danger" onclick="del('${p.id}')">Delete</button></div></div>`).join('')}catch(e){$('form').style.display='none';$('status').className='status err';$('status').textContent=e.message}}
$('connect').onclick=async()=>{token=$('token').value.trim();localStorage.setItem('sol_admin_token',token);await load()};$('form').onsubmit=async e=>{e.preventDefault();$('add').disabled=true;$('status').textContent='Saving product…';try{const d=await api('/api/admin/products',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({amazonUrl:$('url').value.trim(),title:$('title').value.trim(),price:$('price').value.trim(),imageUrl:$('image').value.trim(),badge:$('badge').value,advantages:$('advantages').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean)})});$('form').reset();$('status').className='status ok';$('status').textContent='Product added successfully.';await load()}catch(e){$('status').className='status err';$('status').textContent='Add failed: '+e.message}finally{$('add').disabled=false}};async function toggle(id,active){try{await api('/api/admin/products/'+encodeURIComponent(id),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({active})});await load()}catch(e){alert(e.message)}}async function del(id){if(!confirm('Delete this product?'))return;try{await api('/api/admin/products/'+encodeURIComponent(id),{method:'DELETE'});await load()}catch(e){alert(e.message)}}if(token)load();
</script></body></html>
