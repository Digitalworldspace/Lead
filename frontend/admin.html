<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Style Of Life — Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f7f7;color:#111;font-family:Arial,sans-serif}header{background:#111;color:#fff;padding:20px 6%;display:flex;justify-content:space-between}header a{color:#fff;text-decoration:none}.brand{font-weight:800;letter-spacing:1px}
main{max-width:1050px;margin:35px auto;padding:0 20px}.panel{background:#fff;border:1px solid #e8e8e8;border-radius:20px;padding:24px;margin-bottom:24px}
h1{margin:0 0 8px}label{display:block;font-size:13px;font-weight:700;margin:15px 0 7px}input,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;font:inherit}textarea{min-height:100px}
button{border:0;border-radius:999px;padding:12px 18px;background:#111;color:#fff;font-weight:700;cursor:pointer}button.secondary{background:#eee;color:#111}button.danger{background:#b00020}.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}.msg{margin-top:12px;color:#666}
.item{border:1px solid #eee;border-radius:16px;padding:15px;display:flex;gap:15px;align-items:center;margin-top:12px}.item img{width:80px;height:80px;object-fit:cover;border-radius:10px;background:#f5f5f5}.info{flex:1}.title{font-weight:800}.muted{font-size:13px;color:#777;margin-top:5px}.actions{display:flex;gap:7px;flex-wrap:wrap}@media(max-width:700px){.row{grid-template-columns:1fr}.item{align-items:flex-start}}
</style></head>
<body>
<header><div class="brand">STYLE OF LIFE · ADMIN</div><a href="/">Customer Portal</a></header>
<main>
<section class="panel" id="login"><h1>Admin Portal</h1><div class="muted">Use your private ADMIN_TOKEN.</div><label>Admin Token</label><input id="token" type="password" placeholder="Enter admin token"><br><br><button onclick="connect()">Connect</button><div id="loginMsg" class="msg"></div></section>
<section class="panel" id="add" style="display:none"><h2>Add Amazon Product</h2>
<label>Amazon Link *</label><input id="url" placeholder="https://www.amazon.com/dp/XXXXXXXXXX">
<div class="row"><div><label>Title</label><input id="title" placeholder="Product title"></div><div><label>Price</label><input id="price" placeholder="$99.99"></div></div>
<div class="row"><div><label>Image URL</label><input id="image" placeholder="https://..."></div><div><label>Badge</label><input id="badge" value="Style Of Life Pick"></div></div>
<label>Customer Advantages — one per line</label><textarea id="advantages" placeholder="Elegant design&#10;Great value&#10;Highly rated"></textarea><br><button onclick="addProduct()">Add Product</button><div id="addMsg" class="msg"></div></section>
<section class="panel" id="list" style="display:none"><h2>Products</h2><div id="products"></div></section>
</main>
<script>
let token="";
const esc=x=>String(x??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
const msg=(id,t,err=false)=>{const e=document.getElementById(id);e.textContent=t;e.style.color=err?"#b00020":"#666";};
async function connect(){
 token=document.getElementById("token").value.trim(); if(!token)return msg("loginMsg","Enter admin token.",true);
 try{const r=await fetch("/api/admin/products",{headers:{"x-admin-token":token}}),d=await r.json();if(!r.ok)throw Error(d.error||"Connection failed.");
 document.getElementById("add").style.display="block";document.getElementById("list").style.display="block";msg("loginMsg","Connected successfully.");render(d.products||[]);
 }catch(e){msg("loginMsg",e.message,true);}
}
async function addProduct(){
 const body={amazon_url:url.value.trim(),title:title.value.trim(),price:price.value.trim(),image_url:image.value.trim(),badge:badge.value.trim(),advantages:advantages.value.split(/\r?\n/),active:true};
 try{const r=await fetch("/api/admin/products",{method:"POST",headers:{"Content-Type":"application/json","x-admin-token":token},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw Error(d.error||"Could not add product.");
 msg("addMsg","Product added.");url.value=title.value=price.value=image.value=advantages.value="";badge.value="Style Of Life Pick";refresh();
 }catch(e){msg("addMsg",e.message,true);}
}
async function refresh(){const r=await fetch("/api/admin/products",{headers:{"x-admin-token":token}}),d=await r.json();if(!r.ok)throw Error(d.error);render(d.products||[]);}
function render(ps){document.getElementById("products").innerHTML=ps.length?ps.map(p=>`<div class="item"><img src="${esc(p.image_url||"")}" alt=""><div class="info"><div class="title">${esc(p.title)}</div><div class="muted">${esc(p.price||"")} · ASIN: ${esc(p.asin||"")}</div><div class="muted">${p.active?"Visible":"Hidden"}</div></div><div class="actions"><button class="secondary" onclick="toggleP('${p.id}',${!p.active})">${p.active?"Hide":"Show"}</button><button class="danger" onclick="deleteP('${p.id}')">Delete</button></div></div>`).join(""):"<div class='muted'>No products added yet.</div>";}
async function toggleP(id,active){const r=await fetch("/api/admin/products/"+id,{method:"PATCH",headers:{"Content-Type":"application/json","x-admin-token":token},body:JSON.stringify({active})});const d=await r.json();if(!r.ok)return alert(d.error);refresh();}
async function deleteP(id){if(!confirm("Delete this product?"))return;const r=await fetch("/api/admin/products/"+id,{method:"DELETE",headers:{"x-admin-token":token}});const d=await r.json();if(!r.ok)return alert(d.error);refresh();}
</script></body></html>
