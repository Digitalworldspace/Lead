<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Style Of Life Admin</title><style>body{margin:0;background:#f7f7f7;font-family:Arial;color:#111}.wrap{max-width:1050px;margin:30px auto;padding:20px}.panel{background:#fff;border:1px solid #eee;border-radius:16px;padding:24px;margin-bottom:20px}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:700px){.row{grid-template-columns:1fr}}.field{margin-bottom:14px}label{display:block;font-weight:600;margin-bottom:5px}input,textarea{width:100%;box-sizing:border-box;padding:13px;border:1px solid #ddd;border-radius:9px}textarea{min-height:90px}button{border:0;border-radius:9px;padding:12px 18px;background:#111;color:#fff;cursor:pointer}.msg{margin-top:12px;padding:11px;border-radius:9px}.ok{background:#eaf8ef;color:#176b36}.err{background:#fff0f0;color:#a00000}.product{display:flex;gap:15px;align-items:center;border-top:1px solid #eee;padding:15px 0}.product img{width:80px;height:80px;object-fit:cover;border-radius:10px}.grow{flex:1}.danger{background:#b00020}</style></head><body><div class="wrap"><div class="panel"><h1>Affiliate Product Admin</h1><div class="field"><label>Admin Token</label><input id="token" type="password"></div><button id="connect">Connect / Load Products</button><div id="loginMsg"></div></div><form id="form" class="panel"><h2>Add Product</h2><div class="row"><div class="field"><label>Product Name *</label><input id="title" required></div><div class="field"><label>Price</label><input id="price"></div></div><div class="field"><label>Product Image URL</label><input id="image" type="url"></div><div class="field"><label>Short Description / Benefits</label><textarea id="desc"></textarea></div><div class="field"><label>Affiliate Link *</label><input id="link" type="url" required></div><button id="add" type="submit">Add Product</button><div id="msg"></div></form><div class="panel"><h2>Products</h2><div id="list">Connect first.</div></div></div><script>
const $=x=>document.getElementById(x),esc=v=>String(v||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c])),H=()=>({"Content-Type":"application/json","x-admin-token":$("token").value.trim()});
async function j(r){let t=await r.text();try{return t?JSON.parse(t):{}}catch{return{error:t||("HTTP "+r.status)}}}
function msg(id,t,ok){$(id).textContent=t;$(id).className=ok?"msg ok":"msg err"}
async function load(){try{let r=await fetch("/api/admin/products",{headers:H()}),d=await j(r);if(!r.ok)return msg("loginMsg",d.error||"Invalid token");msg("loginMsg","Connected successfully.",true);render(d)}catch(e){msg("loginMsg","Server connection failed.")}}
$("connect").onclick=load;
$("form").onsubmit=async ev=>{ev.preventDefault();if(!$("token").value.trim())return msg("msg","Enter ADMIN_TOKEN first.");$("add").disabled=true;$("add").textContent="Adding...";try{let r=await fetch("/api/admin/products",{method:"POST",headers:H(),body:JSON.stringify({title:$("title").value.trim(),price:$("price").value.trim(),image_url:$("image").value.trim(),description:$("desc").value.trim(),affiliate_url:$("link").value.trim()})}),d=await j(r);if(!r.ok)return msg("msg",d.error||"Could not add product.");msg("msg","Product added successfully!",true);$("form").reset();load()}catch(e){msg("msg","Server connection failed.")}finally{$("add").disabled=false;$("add").textContent="Add Product"}};
function render(a){if(!a.length)return $("list").textContent="No products yet.";list.innerHTML=a.map(p=>`<div class="product">${p.image_url?`<img src="${esc(p.image_url)}">`:""}<div class="grow"><b>${esc(p.title)}</b><br>${esc(p.price||"")}<br>${p.active?"Visible":"Hidden"}</div><button type="button" onclick="toggle('${p.id}',${!p.active})">${p.active?"Hide":"Show"}</button> <button type="button" class="danger" onclick="del('${p.id}')">Delete</button></div>`).join("")}
async function toggle(id,a){await fetch("/api/admin/products/"+id,{method:"PATCH",headers:H(),body:JSON.stringify({active:a})});load()}async function del(id){if(confirm("Delete this product?")){await fetch("/api/admin/products/"+id,{method:"DELETE",headers:H()});load()}}
</script></body></html>
