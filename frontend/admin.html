<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Style Of Life - Admin</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f7f7;font-family:Arial;color:#111}.wrap{max-width:1050px;margin:30px auto;padding:20px}.panel{background:#fff;border:1px solid #eee;border-radius:16px;padding:24px;margin-bottom:20px}h1{margin-top:0}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:700px){.row{grid-template-columns:1fr}}input,textarea{width:100%;padding:13px;border:1px solid #ddd;border-radius:9px;margin-top:6px}textarea{min-height:90px}label{font-weight:600;font-size:14px}button{border:0;border-radius:9px;padding:12px 17px;background:#111;color:#fff;cursor:pointer;margin-top:14px}.product{display:flex;gap:16px;align-items:center;border-top:1px solid #eee;padding:15px 0}.product img{width:80px;height:80px;object-fit:cover;border-radius:10px}.grow{flex:1}.danger{background:#b00020}.muted{color:#666}</style></head><body><div class="wrap"><div class="panel"><h1>Affiliate Product Admin</h1><p class="muted">Add an affiliate link and it will appear on the customer website.</p><label>Admin Token</label><input id="token" type="password" placeholder="Enter ADMIN_TOKEN"></div><div class="panel"><h2>Add Product</h2><div class="row"><div><label>Product Name *</label><input id="title" placeholder="Example: Moissanite Bracelet"></div><div><label>Price</label><input id="price" placeholder="$49.99"></div></div><p><label>Product Image URL</label><input id="image" placeholder="https://..."></p><p><label>Short Description / Benefits</label><textarea id="desc"></textarea></p><p><label>Affiliate Link *</label><input id="link" placeholder="https://...your-affiliate-link..."></p><button onclick="add()">Add Product</button><div id="msg"></div></div><div class="panel"><h2>Products</h2><div id="list">Enter token to load products.</div></div></div><script>const $=x=>document.getElementById(x);function headers(){return{"Content-Type":"application/json","x-admin-token":$("token").value}}$("token").addEventListener("change",load);async function add(){const b={title:$("title").value,price:$("price").value,image_url:$("image").value,description:$("desc").value,affiliate_url:$("link").value};const r=await fetch("/api/admin/products",{method:"POST",headers:headers(),body:JSON.stringify(b)}),d=await r.json();$("msg").textContent=r.ok?"Product added!":d.error;if(r.ok){["title","price","image","desc","link"].forEach(x=>$(x).value="");load()}}async function load(){if(!$("token").value)return;const r=await fetch("/api/admin/products",{headers:headers()}),d=await r.json();if(!r.ok){$("list").textContent=d.error||"Invalid token";return}$("list").innerHTML=d.length?d.map(p=>'<div class="product">'+(p.image_url?'<img src="'+esc(p.image_url)+'">':'')+'<div class="grow"><b>'+esc(p.title)+'</b><br>'+esc(p.price||"")+'<br><span class="muted">'+(p.active?"Visible":"Hidden")+'</span></div><button onclick="toggle(\''+p.id+'\','+(!p.active)+')">'+(p.active?"Hide":"Show")+'</button> <button class="danger" onclick="del(\''+p.id+'\')">Delete</button></div>').join(""):"No products yet."}async function toggle(id,a){await fetch("/api/admin/products/"+id,{method:"PATCH",headers:headers(),body:JSON.stringify({active:a})});load()}async function del(id){if(confirm("Delete this product?")){await fetch("/api/admin/products/"+id,{method:"DELETE",headers:headers()});load()}}function esc(v){return String(v||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}</script></body></html>
