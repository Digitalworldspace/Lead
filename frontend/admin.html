<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Style Of Life - Affiliate Admin</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f7f7f7;font-family:Arial,sans-serif;color:#111}
.wrap{max-width:1050px;margin:30px auto;padding:20px}
.panel{background:#fff;border:1px solid #eee;border-radius:16px;padding:24px;margin-bottom:20px}
h1,h2{margin-top:0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.row{grid-template-columns:1fr}}
label{display:block;font-weight:600;font-size:14px;margin-bottom:5px}
input,textarea{width:100%;padding:13px;border:1px solid #ddd;border-radius:9px;font-size:15px}
textarea{min-height:90px;resize:vertical}
.field{margin-bottom:14px}
button{border:0;border-radius:9px;padding:12px 18px;background:#111;color:#fff;cursor:pointer;font-size:14px}
button:disabled{opacity:.55;cursor:not-allowed}
.secondary{background:#555}
.danger{background:#b00020}
.msg{margin-top:14px;padding:11px;border-radius:9px;display:none}
.msg.ok{display:block;background:#eaf8ef;color:#176b36}
.msg.err{display:block;background:#fff0f0;color:#a00000}
.product{display:flex;gap:16px;align-items:center;border-top:1px solid #eee;padding:15px 0}
.product img{width:80px;height:80px;object-fit:cover;border-radius:10px;background:#eee}
.grow{flex:1}
.actions{display:flex;gap:7px;flex-wrap:wrap}
.muted{color:#666}
</style>
</head>
<body>
<div class="wrap">

<div class="panel">
  <h1>Affiliate Product Admin</h1>
  <p class="muted">Enter your ADMIN_TOKEN first, then add affiliate products.</p>
  <div class="field">
    <label>Admin Token</label>
    <input id="token" type="password" placeholder="Enter your ADMIN_TOKEN">
  </div>
  <button id="connectBtn" type="button" onclick="connect()">Connect / Load Products</button>
  <div id="loginMsg" class="msg"></div>
</div>

<form id="productForm" class="panel">
  <h2>Add Product</h2>

  <div class="row">
    <div class="field">
      <label>Product Name *</label>
      <input id="title" required placeholder="Example: Moissanite Bracelet">
    </div>
    <div class="field">
      <label>Price</label>
      <input id="price" placeholder="$49.99">
    </div>
  </div>

  <div class="field">
    <label>Product Image URL</label>
    <input id="image" type="url" placeholder="https://example.com/product-image.jpg">
  </div>

  <div class="field">
    <label>Short Description / Benefits</label>
    <textarea id="desc" placeholder="Elegant design, perfect gift..."></textarea>
  </div>

  <div class="field">
    <label>Affiliate Link *</label>
    <input id="link" type="url" required placeholder="https://your-affiliate-link...">
  </div>

  <button id="addBtn" type="submit">Add Product</button>
  <div id="msg" class="msg"></div>
</form>

<div class="panel">
  <h2>Products</h2>
  <div id="list" class="muted">Connect first to load products.</div>
</div>

</div>

<script>
const $ = id => document.getElementById(id);

function token() {
  return $("token").value.trim();
}

function headers() {
  return {
    "Content-Type": "application/json",
    "x-admin-token": token()
  };
}

function show(id, text, ok=false) {
  const el = $(id);
  el.textContent = text;
  el.className = "msg " + (ok ? "ok" : "err");
}

async function safeJson(response) {
  const text = await response.text();
  try { return text ? JSON.parse(text) : {}; }
  catch (_) { return {error: text || ("HTTP " + response.status)}; }
}

async function connect() {
  if (!token()) {
    show("loginMsg", "Please enter your ADMIN_TOKEN.");
    return;
  }

  $("connectBtn").disabled = true;
  $("connectBtn").textContent = "Connecting...";

  try {
    const r = await fetch("/api/admin/products", {headers: headers()});
    const d = await safeJson(r);

    if (!r.ok) {
      show("loginMsg", d.error || "Connection failed. Check ADMIN_TOKEN and Vercel Environment Variables.");
      return;
    }

    show("loginMsg", "Connected successfully.", true);
    render(d);
  } catch (e) {
    show("loginMsg", "Cannot connect to the server. Check your Vercel deployment.", false);
  } finally {
    $("connectBtn").disabled = false;
    $("connectBtn").textContent = "Connect / Load Products";
  }
}

$("productForm").addEventListener("submit", async function(e) {
  e.preventDefault();

  if (!token()) {
    show("msg", "Please enter your ADMIN_TOKEN first.");
    return;
  }

  const title = $("title").value.trim();
  const link = $("link").value.trim();

  if (!title || !link) {
    show("msg", "Product Name and Affiliate Link are required.");
    return;
  }

  $("addBtn").disabled = true;
  $("addBtn").textContent = "Adding...";

  try {
    const r = await fetch("/api/admin/products", {
      method: "POST",
      headers: headers(),
      body: JSON.stringify({
        title,
        price: $("price").value.trim(),
        image_url: $("image").value.trim(),
        description: $("desc").value.trim(),
        affiliate_url: link
      })
    });

    const d = await safeJson(r);

    if (!r.ok) {
      show("msg", d.error || "Product could not be added.");
      return;
    }

    show("msg", "Product added successfully!", true);
    $("productForm").reset();
    await loadProducts();
  } catch (e) {
    show("msg", "Network/server error. Check Vercel deployment and Supabase settings.");
  } finally {
    $("addBtn").disabled = false;
    $("addBtn").textContent = "Add Product";
  }
});

async function loadProducts() {
  if (!token()) return;

  try {
    const r = await fetch("/api/admin/products", {headers: headers()});
    const d = await safeJson(r);

    if (!r.ok) {
      $("list").textContent = d.error || "Could not load products.";
      return;
    }

    render(d);
  } catch (_) {
    $("list").textContent = "Could not connect to the server.";
  }
}

function render(products) {
  if (!products.length) {
    $("list").textContent = "No products yet.";
    return;
  }

  $("list").innerHTML = products.map(p => `
    <div class="product">
      ${p.image_url ? `<img src="${esc(p.image_url)}" alt="">` : `<div style="width:80px;height:80px"></div>`}
      <div class="grow">
        <b>${esc(p.title)}</b><br>
        ${esc(p.price || "")}<br>
        <span class="muted">${p.active ? "Visible" : "Hidden"}</span>
      </div>
      <div class="actions">
        <button type="button" onclick="toggleProduct('${p.id}', ${!p.active})">${p.active ? "Hide" : "Show"}</button>
        <button type="button" class="danger" onclick="deleteProduct('${p.id}')">Delete</button>
      </div>
    </div>
  `).join("");
}

async function toggleProduct(id, active) {
  try {
    const r = await fetch("/api/admin/products/" + id, {
      method: "PATCH",
      headers: headers(),
      body: JSON.stringify({active})
    });
    if (!r.ok) {
      const d = await safeJson(r);
      alert(d.error || "Update failed.");
      return;
    }
    loadProducts();
  } catch (_) {
    alert("Server connection failed.");
  }
}

async function deleteProduct(id) {
  if (!confirm("Delete this product?")) return;

  try {
    const r = await fetch("/api/admin/products/" + id, {
      method: "DELETE",
      headers: headers()
    });
    if (!r.ok) {
      const d = await safeJson(r);
      alert(d.error || "Delete failed.");
      return;
    }
    loadProducts();
  } catch (_) {
    alert("Server connection failed.");
  }
}

function esc(v) {
  return String(v || "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}
</script>
</body>
</html>
