name: Update Product Details

on:
  push:
    paths:
      - "links.json"
      - ".github/workflows/update-products.yml"
      - ".github/scripts/update-products.js"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-products:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch product details
        run: node .github/scripts/update-products.js

      - name: Commit products.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products.json
          if git diff --cached --quiet; then
            echo "No changes to products.json"
          else
            git commit -m "Update affiliate products"
            git push
          fi
