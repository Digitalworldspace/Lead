name: Update Product Details

on:
  push:
    paths:
      - "links.json"
      - ".github/workflows/update-products.yml"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-products:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Product Details
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");

            const links = JSON.parse(
              fs.readFileSync("links.json", "utf8")
            );

            const urls = Array.isArray(links)
              ? links
              : (links.links || []);

            function decode(value) {
              return String(value || "")
                .replace(/&amp;/g, "&")
                .replace(/&quot;/g, '"')
                .replace(/&#39;/g, "'")
                .replace(/&lt;/g, "<")
                .replace(/&gt;/g, ">");
            }

            function getMeta(html, key) {
              const escaped = key.replace(
                /[.*+?^${}()|[\]\\]/g,
                "\\$&"
              );

              const r1 = new RegExp(
                '<meta[^>]+(?:property|name)=["\\']' +
                escaped +
                '["\\'][^>]+content=["\\']([^"\\']*)["\\']',
                "i"
              );

              const r2 = new RegExp(
                '<meta[^>]+content=["\\']([^"\\']*)["\\'][^>]+(?:property|name)=["\\']' +
                escaped +
                '["\\']',
                "i"
              );

              const match =
                html.match(r1) ||
                html.match(r2);

              return match
                ? decode(match[1])
                : "";
            }

            const products = [];

            for (const url of urls) {

              if (
                !url ||
                !/^https?:\/\//i.test(url)
              ) {
                continue;
              }

              const product = {
                title: "Amazon Product",
                price: "",
                image: "",
                description: "",
                link: url,
                active: true
              };

              try {

                const response = await fetch(url, {
                  redirect: "follow",
                  headers: {
                    "User-Agent":
                      "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120 Safari/537.36",
                    "Accept":
                      "text/html,application/xhtml+xml"
                  }
                });

                if (!response.ok) {
                  throw new Error(
                    "HTTP " + response.status
                  );
                }

                const html =
                  await response.text();

                product.title =
                  getMeta(html, "og:title") ||
                  getMeta(html, "twitter:title") ||
                  "Amazon Product";

                product.image =
                  getMeta(html, "og:image") ||
                  getMeta(html, "twitter:image");

                product.description =
                  getMeta(html, "og:description") ||
                  getMeta(html, "description") ||
                  getMeta(html, "twitter:description");

                const price =
                  getMeta(
                    html,
                    "product:price:amount"
                  ) ||
                  getMeta(
                    html,
                    "og:price:amount"
                  );

                const currency =
                  getMeta(
                    html,
                    "product:price:currency"
                  ) ||
                  getMeta(
                    html,
                    "og:price:currency"
                  );

                if (price) {
                  product.price =
                    currency
                      ? `${currency} ${price}`
                      : price;
                }

              } catch (error) {

                core.warning(
                  "Could not fetch " +
                  url +
                  ": " +
                  error.message
                );

              }

              products.push(product);
            }

            fs.writeFileSync(
              "products.json",
              JSON.stringify(
                products,
                null,
                2
              ) + "\n"
            );

      - name: Save products.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add products.json

          git diff --cached --quiet || \
            git commit -m "Update affiliate products"

          git push
