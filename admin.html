<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Style Of Life - Admin</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  color: #111;
}

.container {
  width: min(700px, 92%);
  margin: 50px auto;
}

.card {
  background: #fff;
  padding: 32px;
  border-radius: 18px;
  box-shadow: 0 10px 35px rgba(0,0,0,.08);
}

h1 {
  text-align: center;
  margin: 0;
}

.subtitle {
  text-align: center;
  color: #666;
  margin: 8px 0 30px;
}

label {
  display: block;
  font-weight: 600;
  margin: 18px 0 8px;
}

input,
textarea {
  width: 100%;
  padding: 13px;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 15px;
}

textarea {
  min-height: 120px;
  resize: vertical;
}

button {
  width: 100%;
  margin-top: 25px;
  padding: 15px;
  border: 0;
  border-radius: 10px;
  background: #111;
  color: white;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
}

button:disabled {
  opacity: .6;
}

#status {
  margin-top: 20px;
  padding: 12px;
  border-radius: 8px;
  text-align: center;
  font-weight: 600;
  display: none;
}

.success {
  display: block !important;
  background: #eaf8ee;
  color: #087a27;
}

.error {
  display: block !important;
  background: #fff0f0;
  color: #b00020;
}

.login {
  border-bottom: 1px solid #eee;
  padding-bottom: 25px;
  margin-bottom: 25px;
}

.hidden {
  display: none;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h1>Style Of Life</h1>

<div class="subtitle">
Product Admin Portal
</div>


<!-- LOGIN -->

<div id="loginBox" class="login">

<label>
Admin Password
</label>

<input
  id="adminPassword"
  type="password"
  placeholder="Enter admin password"
>

<button
  onclick="login()"
>
Continue
</button>

</div>


<!-- PRODUCT FORM -->

<div
  id="productBox"
  class="hidden"
>


<label>
Product Name
</label>

<input
  id="productName"
  type="text"
  placeholder="Enter product name"
>


<label>
Amazon Affiliate Link
</label>

<input
  id="affiliateLink"
  type="url"
  placeholder="https://link.amazon/..."
>


<label>
Photo URL
</label>

<input
  id="photoUrl"
  type="url"
  placeholder="https://..."
>


<label>
Price
</label>

<input
  id="price"
  type="text"
  placeholder="$29.99"
>


<label>
Description
</label>

<textarea
  id="description"
  placeholder="Enter product description"
></textarea>


<button
  id="addButton"
  onclick="addProduct()"
>
Add Product
</button>


<div id="status"></div>

</div>

</div>

</div>


<script>

/*
========================================
YOUR BACKEND URL
========================================
*/

const API_URL =
  "https://YOUR-BACKEND.onrender.com";


let adminPassword = "";


/*
========================================
LOGIN
========================================
*/

function login() {

  const password =
    document
      .getElementById("adminPassword")
      .value
      .trim();


  if (!password) {

    alert(
      "Please enter admin password."
    );

    return;

  }


  adminPassword =
    password;


  document
    .getElementById("loginBox")
    .classList
    .add("hidden");


  document
    .getElementById("productBox")
    .classList
    .remove("hidden");

}


/*
========================================
STATUS
========================================
*/

function showStatus(
  message,
  type
) {

  const status =
    document.getElementById(
      "status"
    );

  status.textContent =
    message;

  status.className =
    type || "";

}


/*
========================================
ADD PRODUCT
========================================
*/

async function addProduct() {

  const button =
    document.getElementById(
      "addButton"
    );


  const productName =
    document
      .getElementById(
        "productName"
      )
      .value
      .trim();


  const affiliateLink =
    document
      .getElementById(
        "affiliateLink"
      )
      .value
      .trim();


  const photoUrl =
    document
      .getElementById(
        "photoUrl"
      )
      .value
      .trim();


  const price =
    document
      .getElementById(
        "price"
      )
      .value
      .trim();


  const description =
    document
      .getElementById(
        "description"
      )
      .value
      .trim();


  if (
    !productName ||
    !affiliateLink ||
    !photoUrl ||
    !price ||
    !description
  ) {

    showStatus(
      "Please fill all 5 fields.",
      "error"
    );

    return;

  }


  button.disabled =
    true;

  button.textContent =
    "Saving...";


  showStatus(
    "Saving product...",
    ""
  );


  try {

    const response =
      await fetch(
        API_URL +
        "/api/products",
        {

          method: "POST",

          headers: {

            "Content-Type":
              "application/json",

            "X-Admin-Password":
              adminPassword

          },

          body: JSON.stringify({

            productName,

            affiliateLink,

            photoUrl,

            price,

            description

          })

        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.message ||
        "Could not add product."
      );

    }


    showStatus(
      "✅ Product added successfully!",
      "success"
    );


    document
      .getElementById(
        "productName"
      )
      .value = "";


    document
      .getElementById(
        "affiliateLink"
      )
      .value = "";


    document
      .getElementById(
        "photoUrl"
      )
      .value = "";


    document
      .getElementById(
        "price"
      )
      .value = "";


    document
      .getElementById(
        "description"
      )
      .value = "";


  } catch (error) {

    console.error(error);


    showStatus(
      "❌ " +
      error.message,
      "error"
    );

  }


  button.disabled =
    false;

  button.textContent =
    "Add Product";

}

</script>

</body>

</html>
