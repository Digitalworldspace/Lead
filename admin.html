<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Style Of Life - Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    .container {
      width: min(700px, 92%);
      margin: 50px auto;
    }

    .card {
      background: #fff;
      padding: 32px;
      border-radius: 18px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: 30px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-top: 8px;
      margin-bottom: 30px;
    }

    label {
      display: block;
      font-weight: 600;
      margin: 18px 0 8px;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      background: #fff;
    }

    input:focus,
    textarea:focus {
      border-color: #111;
      box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.05);
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: #111;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: #222;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #status {
      margin-top: 20px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-weight: 600;
      display: none;
      word-break: break-word;
    }

    #status.success {
      display: block;
      color: #087a27;
      background: #eaf8ee;
    }

    #status.error {
      display: block;
      color: #b00020;
      background: #fff0f0;
    }

    #status.info {
      display: block;
      color: #333;
      background: #f1f1f1;
    }

    .token-section {
      margin-top: 30px;
      padding-top: 25px;
      border-top: 1px solid #eee;
    }

    .token-note {
      margin-top: 8px;
      font-size: 13px;
      color: #777;
      line-height: 1.5;
    }

    .security-note {
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      background: #fff8e6;
      color: #6b5200;
      font-size: 13px;
      line-height: 1.5;
    }

    @media (max-width: 600px) {
      .container {
        margin: 25px auto;
      }

      .card {
        padding: 22px;
      }

      h1 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <h1>Style Of Life</h1>

      <div class="subtitle">
        Product Admin Portal
      </div>


      <!-- Product Name -->
      <label for="productName">
        Product Name
      </label>

      <input
        id="productName"
        type="text"
        placeholder="Enter product name"
        autocomplete="off"
      >


      <!-- Amazon Affiliate Link -->
      <label for="affiliateLink">
        Amazon Affiliate Link
      </label>

      <input
        id="affiliateLink"
        type="url"
        placeholder="https://link.amazon/..."
        autocomplete="off"
      >


      <!-- Photo URL -->
      <label for="photoUrl">
        Photo URL
      </label>

      <input
        id="photoUrl"
        type="url"
        placeholder="https://example.com/product-image.jpg"
        autocomplete="off"
      >


      <!-- Price -->
      <label for="price">
        Price
      </label>

      <input
        id="price"
        type="text"
        placeholder="$29.99"
        autocomplete="off"
      >


      <!-- Description -->
      <label for="description">
        Description
      </label>

      <textarea
        id="description"
        placeholder="Enter product description"
      ></textarea>


      <!-- GitHub Token -->
      <div class="token-section">

        <label for="githubToken">
          GitHub Token
        </label>

        <input
          id="githubToken"
          type="password"
          placeholder="github_pat_..."
          autocomplete="new-password"
        >

        <div class="token-note">
          Your token is used to update products.json in your GitHub repository.
        </div>

      </div>


      <!-- Add Product -->
      <button
        id="addButton"
        type="button"
        onclick="addProduct()"
      >
        Add Product
      </button>


      <!-- Status -->
      <div id="status"></div>


      <div class="security-note">
        Never share your GitHub token with anyone.
        Do not put the token inside your GitHub code.
      </div>

    </div>

  </div>


<script>

  /*
    ==========================================
    GITHUB SETTINGS
    ==========================================
  */

  const OWNER = "Digitalworldspace";

  const REPO = "Lead";

  const FILE = "products.json";

  const BRANCH = "main";


  /*
    ==========================================
    STATUS MESSAGE
    ==========================================
  */

  function showStatus(message, type) {

    const status =
      document.getElementById("status");

    status.textContent = message;

    status.className = type || "info";

  }


  /*
    ==========================================
    READ JSON FILE FROM GITHUB
    ==========================================
  */

  async function getProductsFile(token) {

    const apiUrl =
      `https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE}?ref=${BRANCH}`;


    const response =
      await fetch(apiUrl, {

        method: "GET",

        headers: {

          "Authorization":
            `Bearer ${token}`,

          "Accept":
            "application/vnd.github+json",

          "X-GitHub-Api-Version":
            "2022-11-28"

        }

      });


    /*
      If GitHub returns an error,
      show the REAL GitHub error.
    */

    if (!response.ok) {

      let errorMessage =
        `GitHub HTTP ${response.status}`;

      try {

        const errorData =
          await response.json();

        if (errorData.message) {

          errorMessage =
            errorData.message;

        }

      } catch (error) {
        // Keep HTTP error
      }

      throw new Error(
        errorMessage
      );

    }


    return await response.json();

  }


  /*
    ==========================================
    DECODE GITHUB FILE
    ==========================================
  */

  function decodeGitHubContent(base64Content) {

    const cleanBase64 =
      base64Content.replace(/\n/g, "");


    const binary =
      atob(cleanBase64);


    const bytes =
      Uint8Array.from(
        binary,
        character =>
          character.charCodeAt(0)
      );


    return new TextDecoder(
      "utf-8"
    ).decode(bytes);

  }


  /*
    ==========================================
    ENCODE FILE FOR GITHUB
    ==========================================
  */

  function encodeGitHubContent(text) {

    const bytes =
      new TextEncoder().encode(text);


    let binary = "";


    for (
      let i = 0;
      i < bytes.length;
      i++
    ) {

      binary +=
        String.fromCharCode(
          bytes[i]
        );

    }


    return btoa(binary);

  }


  /*
    ==========================================
    ADD PRODUCT
    ==========================================
  */

  async function addProduct() {

    const button =
      document.getElementById(
        "addButton"
      );


    /*
      Get form values
    */

    const name =
      document.getElementById(
        "productName"
      ).value.trim();


    const affiliate =
      document.getElementById(
        "affiliateLink"
      ).value.trim();


    const photo =
      document.getElementById(
        "photoUrl"
      ).value.trim();


    const price =
      document.getElementById(
        "price"
      ).value.trim();


    const description =
      document.getElementById(
        "description"
      ).value.trim();


    const token =
      document.getElementById(
        "githubToken"
      ).value.trim();


    /*
      Validate fields
    */

    if (!name) {

      showStatus(
        "Please enter Product Name.",
        "error"
      );

      return;

    }


    if (!affiliate) {

      showStatus(
        "Please enter Amazon Affiliate Link.",
        "error"
      );

      return;

    }


    if (!photo) {

      showStatus(
        "Please enter Photo URL.",
        "error"
      );

      return;

    }


    if (!price) {

      showStatus(
        "Please enter Price.",
        "error"
      );

      return;

    }


    if (!description) {

      showStatus(
        "Please enter Description.",
        "error"
      );

      return;

    }


    if (!token) {

      showStatus(
        "Please enter GitHub Token.",
        "error"
      );

      return;

    }


    /*
      Disable button
    */

    button.disabled = true;

    button.textContent =
      "Saving...";


    try {

      /*
        Step 1:
        Read products.json
      */

      showStatus(
        "Reading products.json from GitHub...",
        "info"
      );


      const fileData =
        await getProductsFile(
          token
        );


      /*
        Step 2:
        Decode products.json
      */

      const decoded =
        decodeGitHubContent(
          fileData.content
        );


      /*
        Step 3:
        Parse JSON
      */

      let products;


      try {

        products =
          JSON.parse(decoded);

      } catch (error) {

        throw new Error(
          "products.json contains invalid JSON."
        );

      }


      /*
        Make sure it is an array
      */

      if (!Array.isArray(products)) {

        throw new Error(
          "products.json must contain a JSON array."
        );

      }


      /*
        Step 4:
        Create new product
      */

      const newProduct = {

        title: name,

        price: price,

        image: photo,

        description: description,

        link: affiliate,

        active: true

      };


      /*
        Step 5:
        Add product
      */

      products.push(
        newProduct
      );


      /*
        Step 6:
        Create new JSON
      */

      const newContent =
        JSON.stringify(
          products,
          null,
          2
        ) + "\n";


      /*
        Step 7:
        Encode JSON
      */

      const encodedContent =
        encodeGitHubContent(
          newContent
        );


      /*
        Step 8:
        GitHub API URL
      */

      const apiUrl =
        `https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE}`;


      /*
        Step 9:
        Update GitHub
      */

      showStatus(
        "Adding product to GitHub...",
        "info"
      );


      const updateResponse =
        await fetch(apiUrl, {

          method: "PUT",

          headers: {

            "Authorization":
              `Bearer ${token}`,

            "Accept":
              "application/vnd.github+json",

            "Content-Type":
              "application/json",

            "X-GitHub-Api-Version":
              "2022-11-28"

          },

          body: JSON.stringify({

            message:
              `Add product: ${name}`,

            content:
              encodedContent,

            sha:
              fileData.sha,

            branch:
              BRANCH

          })

        });


      /*
        Check GitHub response
      */

      if (!updateResponse.ok) {

        let errorMessage =
          `GitHub HTTP ${updateResponse.status}`;


        try {

          const errorData =
            await updateResponse.json();


          if (
            errorData.message
          ) {

            errorMessage =
              errorData.message;

          }

        } catch (error) {
          // Keep HTTP error
        }


        throw new Error(
          errorMessage
        );

      }


      /*
        Product successfully added
      */

      showStatus(
        "✅ Product added successfully to GitHub!",
        "success"
      );


      /*
        Clear product fields
      */

      document.getElementById(
        "productName"
      ).value = "";


      document.getElementById(
        "affiliateLink"
      ).value = "";


      document.getElementById(
        "photoUrl"
      ).value = "";


      document.getElementById(
        "price"
      ).value = "";


      document.getElementById(
        "description"
      ).value = "";


    } catch (error) {

      console.error(
        "Product save error:",
        error
      );


      showStatus(
        "❌ " + error.message,
        "error"
      );


    } finally {

      button.disabled = false;

      button.textContent =
        "Add Product";

    }

  }

</script>

</body>
</html>
