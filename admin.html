<!doctype html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Style Of Life — Add Product</title>
<style>
body{font-family:Arial;margin:0;background:#f7f7f7;color:#111}
.wrap{max-width:850px;margin:35px auto;padding:20px}.card{background:#fff;padding:25px;border-radius:15px}
input,textarea{width:100%;box-sizing:border-box;padding:12px;margin:7px 0 14px;border:1px solid #ccc;border-radius:8px}
textarea{min-height:100px}button{background:#111;color:#fff;border:0;border-radius:8px;padding:12px 18px;font-weight:bold;cursor:pointer}
pre{white-space:pre-wrap;background:#f1f1f1;padding:15px;border-radius:8px;margin-top:20px}
</style></head>
<body><div class="wrap"><div class="card">
<h1>Add Affiliate Product</h1>
<p>Fill the fields, then copy the generated JSON into <b>products.json</b> in GitHub.</p>
<label>Product Name</label><input id="title">
<label>Price</label><input id="price">
<label>Product Image URL</label><input id="image">
<label>Description / Benefits</label><textarea id="description"></textarea>
<label>Affiliate Link</label><input id="link">
<button onclick="generate()">Generate Product JSON</button>
<pre id="output">Your product JSON will appear here.</pre>
</div></div>
<script>
function generate(){
 const p={title:title.value.trim(),price:price.value.trim(),image:image.value.trim(),description:description.value.trim(),link:link.value.trim(),active:true};
 document.getElementById("output").textContent=JSON.stringify(p,null,2);
}
</script></body></html>
