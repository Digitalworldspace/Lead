<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Style Of Life | Product Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top, #ffffff 0%, #f5f5f5 45%, #eeeeee 100%);
      color: #111;
      min-height: 100vh;
    }

    .container {
      width: min(680px, calc(100% - 28px));
      margin: 35px auto;
      background: #fff;
      padding: 30px;
      border-radius: 22px;
      box-shadow: 0 15px 50px rgba(0,0,0,.10);
    }

    .brand {
      text-align: center;
      margin-bottom: 30px;
    }

    .brand h1 {
      margin: 0;
      font-size: 30px;
      letter-spacing: -1px;
    }

    .brand p {
      margin: 7px 0 0;
      color: #777;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-size: 14px;
      font-weight: 700;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 11px;
      padding: 13px;
      font-size: 14px;
      outline: none;
      background: #fff;
      transition: .2s;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #111;
      box-shadow: 0 0 0 3px rgba(0,0,0,.06);
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .currency-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .currency-box {
      padding: 15px;
      border-radius: 14px;
      background: #f8f8f8;
      border: 1px solid #eee;
    }

    .currency-preview {
      margin-top: 8px;
      font-size: 13px;
      color: #777;
    }

    button {
      width: 100%;
      margin-top: 24px;
      border: 0;
      border-radius: 11px;
      padding: 14px;
      background: #111;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: .25s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0,0,0,.18);
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    #status {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      display: none;
      font-size: 14px;
      line-height: 1.5;
    }

    .success {
      display: block !important;
      background: #eaf8ef;
      color: #176b36;
    }

    .error {
      display: block !important;
      background: #fff0f0;
      color: #a40000;
    }

    .note {
      margin-top: 20px;
      text-align: center;
      color: #888;
      font-size: 12px;
      line-height: 1.5;
    }

    @media(max-width:600px) {
      .container {
        padding: 22px;
        margin: 18px auto;
      }

      .currency-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="brand">
    <h1>Style Of Life</h1>
    <p>Product Admin Portal</p>
  </div>

  <label>Admin Password</label>
  <input
    type="password"
    id="adminPassword"
    placeholder="Enter admin password"
  >

  <label>Product Name</label>
  <input
    type="text"
    id="productName"
    placeholder="Enter product name"
  >

  <label>Amazon Affiliate Link</label>
  <input
    type="url"
    id="affiliateLink"
    placeholder="https://..."
  >

  <label>Photo URL</label>
  <input
    type="url"
    id="photoUrl"
    placeholder="https://..."
  >

  <div class="currency-row">

    <div class="currency-box">
      <label>Price</label>
      <input
        type="number"
        id="price"
        min="0"
        step="0.01"
        placeholder="299"
      >
      <div class="currency-preview">
        Product's original price
      </div>
    </div>

    <div class="currency-box">
      <label>Product Currency</label>

      <select id="currency">
        <option value="INR" selected>🇮🇳 INR ₹ — Indian Rupee</option>
        <option value="USD">🇺🇸 USD $ — US Dollar</option>
        <option value="GBP">🇬🇧 GBP £ — British Pound</option>
        <option value="EUR">🇪🇺 EUR € — Euro</option>
        <option value="CAD">🇨🇦 CAD $ — Canadian Dollar</option>
        <option value="AUD">🇦🇺 AUD $ — Australian Dollar</option>
      </select>

      <div class="currency-preview" id="currencyPreview">
        Price will be stored in INR
      </div>
    </div>

  </div>

  <label>Description</label>
  <textarea
    id="description"
    placeholder="Write a short product description..."
  ></textarea>

  <button id="addButton">
    Add Product
  </button>

  <div id="status"></div>

  <div class="note">
    Your product is securely sent to the backend and saved into GitHub.
    <br>
    Never enter your GitHub token here.
  </div>

</div>

<script>

const API_URL =
  "https://lead-1-6z64.onrender.com";

const currencySelect =
  document.getElementById("currency");

const currencyPreview =
  document.getElementById("currencyPreview");

currencySelect.addEventListener("change", () => {

  const currency =
    currencySelect.value;

  const symbols = {
    USD: "$",
    INR: "₹",
    GBP: "£",
    EUR: "€",
    CAD: "CA$",
    AUD: "A$"
  };

  currencyPreview.textContent =
    "Price will be stored in " +
    currency +
    " " +
    symbols[currency];
});

document
  .getElementById("addButton")
  .addEventListener("click", async () => {

    const button =
      document.getElementById("addButton");

    const status =
      document.getElementById("status");

    const adminPassword =
      document.getElementById("adminPassword").value.trim();

    const productName =
      document.getElementById("productName").value.trim();

    const affiliateLink =
      document.getElementById("affiliateLink").value.trim();

    const photoUrl =
      document.getElementById("photoUrl").value.trim();

    const price =
      document.getElementById("price").value.trim();

    const currency =
      document.getElementById("currency").value;

    const description =
      document.getElementById("description").value.trim();

    status.className = "";
    status.style.display = "none";

    if (
      !adminPassword ||
      !productName ||
      !affiliateLink ||
      !photoUrl ||
      !price ||
      !description
    ) {
      status.textContent =
        "❌ Please fill all fields.";

      status.className = "error";
      return;
    }

    button.disabled = true;
    button.textContent = "Adding Product...";

    try {

      const response =
        await fetch(
          API_URL + "/api/products",
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json",
              "X-Admin-Password": adminPassword
            },

            body: JSON.stringify({
              productName,
              affiliateLink,
              photoUrl,
              price,
              currency,
              description
            })
          }
        );

      const text =
        await response.text();

      let data;

      try {
        data = JSON.parse(text);
      } catch {
        throw new Error(
          "Backend returned an unexpected response."
        );
      }

      if (!response.ok || !data.success) {
        throw new Error(
          data.message || "Could not add product."
        );
      }

      status.textContent =
        "✅ Product added successfully to GitHub!";

      status.className = "success";

      document
        .getElementById("productName")
        .value = "";

      document
        .getElementById("affiliateLink")
        .value = "";

      document
        .getElementById("photoUrl")
        .value = "";

      document
        .getElementById("price")
        .value = "";

      document
        .getElementById("description")
        .value = "";

    } catch (error) {

      status.textContent =
        "❌ " + error.message;

      status.className = "error";

    } finally {

      button.disabled = false;
      button.textContent = "Add Product";
    }

  });

</script>

</body>
</html>
