<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Style Of Life</title>
<style>
body{margin:0;font-family:Arial,sans-serif;color:#111;background:#fff}
header{text-align:center;padding:55px 20px;border-bottom:1px solid #eee}
h1{font-size:44px;margin:0 0 10px}.sub{color:#666}
.wrap{max-width:1200px;margin:40px auto;padding:0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:24px}
.card{border:1px solid #eee;border-radius:16px;overflow:hidden;box-shadow:0 6px 25px #0000000d}
.card img{width:100%;height:270px;object-fit:cover;background:#f5f5f5}
.body{padding:18px}.body h2{margin-top:0}.price{font-size:18px;font-weight:bold}
.desc{color:#666;line-height:1.5}
.shop{display:block;background:#111;color:#fff;text-decoration:none;text-align:center;padding:13px;border-radius:10px;margin-top:16px;font-weight:bold}
.state{text-align:center;color:#666;padding:50px}
</style>
</head>
<body>
<header><h1>Style Of Life</h1><div class="sub">Featured Products</div></header>
<div class="wrap"><div id="products" class="grid"><div class="state">Loading...</div></div></div>

<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));
fetch("products.json")
.then(r=>r.json())
.then(products=>{
 const box=document.getElementById("products");
 products=products.filter(p=>p.active!==false);
 if(!products.length){box.innerHTML='<div class="state">No products available.</div>';return}
 box.innerHTML=products.map(p=>`
 <article class="card">
   ${p.image?`<img src="${esc(p.image)}" alt="${esc(p.title)}">`:``}
   <div class="body">
     <h2>${esc(p.title)}</h2>
     ${p.price?`<div class="price">${esc(p.price)}</div>`:""}
     <p class="desc">${esc(p.description||"")}</p>
     <a class="shop" href="${esc(p.link)}" target="_blank" rel="nofollow sponsored noopener">Shop Now</a>
   </div>
 </article>`).join("");
})
.catch(()=>document.getElementById("products").innerHTML='<div class="state">Unable to load products.json</div>');
</script>
</body>
</html>
