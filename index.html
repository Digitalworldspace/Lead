<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Style Of Life | Featured Products</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#fff;color:#111}header{text-align:center;padding:42px 20px 28px;border-bottom:1px solid #eee}header h1{margin:0;font-size:34px;letter-spacing:2px}header p{margin:10px 0 0;color:#666}main{max-width:1200px;margin:auto;padding:35px 20px}#products{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px}.card{border:1px solid #e8e8e8;background:#fff;overflow:hidden;transition:.2s}.card:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(0,0,0,.08)}.photo{width:100%;aspect-ratio:1/1;background:#f7f7f7;display:flex;align-items:center;justify-content:center}.photo img{width:100%;height:100%;object-fit:cover}.no-image{color:#999;font-size:14px}.content{padding:18px}.title{font-size:18px;font-weight:700;line-height:1.35;margin-bottom:10px}.price{font-size:17px;font-weight:700;margin-bottom:10px}.desc{font-size:14px;color:#666;line-height:1.5;min-height:42px}.btn{display:block;margin-top:16px;padding:13px 16px;text-align:center;text-decoration:none;background:#111;color:#fff;font-weight:700}.btn:hover{background:#333}.state{text-align:center;padding:50px 20px;color:#666}.error{color:#b00020}
</style>
</head>
<body>
<header><h1>Style Of Life</h1><p>Featured Products</p></header>
<main><div id="products"><div class="state">Loading products...</div></div></main>
<script>
const box=document.getElementById('products');
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(products){
 if(!Array.isArray(products)||!products.length){box.innerHTML='<div class="state">No products found yet.</div>';return;}
 box.innerHTML=products.filter(p=>p&&p.active!==false).map(p=>{
  const title=p.title||'Amazon Product',price=p.price||'',image=p.image||'',description=p.description||'',link=p.link||'';
  return `<article class="card"><div class="photo">${image?`<img src="${esc(image)}" alt="${esc(title)}" loading="lazy">`:'<div class="no-image">Product image unavailable</div>'}</div><div class="content"><div class="title">${esc(title)}</div>${price?`<div class="price">${esc(price)}</div>`:''}<div class="desc">${esc(description)}</div>${link?`<a class="btn" href="${esc(link)}" target="_blank" rel="nofollow sponsored noopener noreferrer">Shop Now</a>`:''}</div></article>`;
 }).join('');
}
const url=new URL('products.json',window.location.href);url.searchParams.set('t',Date.now());
fetch(url,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}).then(render).catch(e=>{console.error(e);box.innerHTML='<div class="state error">Unable to load products.json.<br><br>Open GitHub Actions and check the Update Product Details workflow.</div>';});
</script>
</body>
</html>
