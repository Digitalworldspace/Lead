<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Style Of Life</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#fff;color:#111}
header{text-align:center;padding:50px 20px;border-bottom:1px solid #eee}
h1{font-size:44px;margin:0 0 8px}.sub{color:#666}
.wrap{max-width:1200px;margin:40px auto;padding:0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:24px}
.card{border:1px solid #eee;border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 5px 25px #0000000c}
.card img{width:100%;height:280px;object-fit:cover;background:#f5f5f5}
.body{padding:18px}.body h2{font-size:20px;margin:0 0 10px}.price{font-weight:bold;font-size:18px;margin-bottom:10px}
.desc{color:#666;line-height:1.5}.shop{display:block;text-align:center;background:#111;color:#fff;text-decoration:none;padding:13px;border-radius:9px;margin-top:16px;font-weight:bold}
.state{text-align:center;color:#777;padding:50px}
</style>
</head>
<body>
<header><h1>Style Of Life</h1><div class="sub">Featured Products</div></header>
<div class="wrap"><div id="products" class="grid"><div class="state">Loading products...</div></div></div>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\\"":"&quot;","'":"&#039;"}[c]));
fetch("products.json?"+Date.now()).then(r=>r.json()).then(items=>{
 const box=document.getElementById("products");
 items=items.filter(x=>x.active!==false);
 if(!items.length){box.innerHTML='<div class="state">No products available.</div>';return}
 box.innerHTML=items.map(p=>`
 <article class="card">
  ${p.image?`<img src="${esc(p.image)}" alt="${esc(p.title)}" loading="lazy">`:``}
  <div class="body">
   <h2>${esc(p.title||"Product")}</h2>
   ${p.price?`<div class="price">${esc(p.price)}</div>`:""}
   <div class="desc">${esc(p.description||"")}</div>
   <a class="shop" href="${esc(p.link)}" target="_blank" rel="nofollow sponsored noopener">Shop Now</a>
  </div>
 </article>`).join("");
}).catch(()=>document.getElementById("products").innerHTML='<div class="state">Products are being updated. Please try again later.</div>');
</script>
</body>
</html>
