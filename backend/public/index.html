<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Style Of Life — Admin Portal</title><style>body{margin:0;background:#f6f5f1;font-family:Arial;color:#111}.head{background:#111;color:#fff;padding:20px 6%;font:25px Georgia,serif}.wrap{max-width:1100px;margin:auto;padding:35px 20px}.box,.item{background:#fff;border:1px solid #e5e1d9;border-radius:18px;padding:20px;margin-bottom:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-size:11px;font-weight:700;display:block;margin:9px 0 5px}input,textarea,select{width:100%;padding:11px;border:1px solid #d7d3cb;border-radius:9px;box-sizing:border-box}textarea{min-height:80px}button{background:#111;color:#fff;border:0;border-radius:9px;padding:11px 15px;margin-top:14px;font-weight:700}.items{display:grid;grid-template-columns:1fr 1fr;gap:15px}.item{display:grid;grid-template-columns:100px 1fr}.pic{width:100px;height:100px;background:#f1f0ec;border-radius:10px;object-fit:contain}.badge{font-size:10px;letter-spacing:.12em;color:#777;text-transform:uppercase}.title{font:20px Georgia,serif;margin:7px 0}.muted{font-size:13px;color:#777}.danger{background:#8a2222}@media(max-width:750px){.grid,.items{grid-template-columns:1fr}}</style></head><body><div class="head">Style Of Life — Amazon Backend Portal</div><div class="wrap"><div class="box"><h2>Add Amazon Product</h2><label>ADMIN TOKEN</label><input id="token" type="password"><form id="f"><div class="grid"><div><label>AMAZON LINK *</label><input id="url" required placeholder="https://www.amazon.com/dp/B0..."></div><div><label>TITLE</label><input id="title"></div><div><label>PRICE</label><input id="price" placeholder="$299"></div><div><label>IMAGE URL</label><input id="img"></div><div><label>BADGE</label><select id="badge"><option>Best Overall</option><option>Best Value</option><option>Best Rated</option><option>Premium Pick</option><option>Style Of Life Pick</option></select></div></div><label>CUSTOMER ADVANTAGES — one per line</label><textarea id="adv"></textarea><button>Add Product</button></form><p id="msg" class="muted"></p></div><div class="items" id="items"></div></div><script>
const $=x=>document.getElementById(x),esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));async function load(){if(!$("token").value)return;let r=await fetch("/api/admin/products",{headers:{"x-admin-token":$("token").value}}),d=await r.json();if(!r.ok){$("msg").textContent=d.error;return}$("items").innerHTML=(d.products||[]).map(p=>`<div class=item>${p.image_url?`<img class=pic src="${esc(p.image_url)}">`:`<div class=pic></div>`}<div><div class=badge>${esc(p.badge)} · ${p.active?"LIVE":"HIDDEN"}</div><div class=title>${esc(p.title)}</div><div>${esc(p.price)}</div><div class=muted>${(p.advantages||[]).map(x=>"✓ "+esc(x)).join("<br>")}</div><button onclick="toggle('${p.id}',${!p.active})">${p.active?"Hide":"Show"}</button> <button class=danger onclick="del('${p.id}')">Delete</button></div></div>`).join("")}
$("token").onchange=load;$("f").onsubmit=async e=>{e.preventDefault();let r=await fetch("/api/admin/products",{method:"POST",headers:{"Content-Type":"application/json","x-admin-token":$("token").value},body:JSON.stringify({amazonUrl:$("url").value,title:$("title").value,price:$("price").value,imageUrl:$("img").value,badge:$("badge").value,advantages:$("adv").value.split("\\n").map(x=>x.trim()).filter(Boolean)})}),d=await r.json();$("msg").textContent=r.ok?"Product saved to Supabase.":d.error;if(r.ok){e.target.reset();load()}};async function toggle(id,a){await fetch("/api/admin/products/"+id,{method:"PATCH",headers:{"Content-Type":"application/json","x-admin-token":$("token").value},body:JSON.stringify({active:a})});load()}async function del(id){if(confirm("Delete?")){await fetch("/api/admin/products/"+id,{method:"DELETE",headers:{"x-admin-token":$("token").value}});load()}}</script></body></html>
