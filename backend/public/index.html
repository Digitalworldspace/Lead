<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Style Of Life — Amazon Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f5f1;color:#111;font-family:Arial,sans-serif}
.head{background:#111;color:#fff;padding:22px 6%;font:26px Georgia,serif}.wrap{max-width:1050px;margin:auto;padding:30px 20px}
.box,.item{background:#fff;border:1px solid #e5e1d9;border-radius:18px;padding:22px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-size:11px;font-weight:700;display:block;margin:10px 0 5px}
input,textarea,select{width:100%;padding:12px;border:1px solid #d7d3cb;border-radius:9px;font-size:14px}textarea{min-height:90px}
button{background:#111;color:#fff;border:0;border-radius:9px;padding:12px 18px;margin-top:15px;font-weight:700;cursor:pointer}
button:disabled{opacity:.55;cursor:not-allowed}.danger{background:#8a2222}.muted{font-size:13px;color:#777}
.items{display:grid;grid-template-columns:1fr 1fr;gap:15px}.item{display:grid;grid-template-columns:100px 1fr;gap:15px}
.pic{width:100px;height:100px;background:#f1f0ec;border-radius:10px;object-fit:contain}.badge{font-size:10px;letter-spacing:.12em;color:#777;text-transform:uppercase}
.title{font:20px Georgia,serif;margin:7px 0}.ok{color:#26734d}.err{color:#a11}
@media(max-width:750px){.grid,.items{grid-template-columns:1fr}}
</style></head><body>
<div class="head">Style Of Life — Amazon Product Portal</div>
<div class="wrap">
<div class="box">
<h2>Add Product</h2>
<label>BACKEND URL</label>
<input id="apiBase" placeholder="https://your-backend.onrender.com">
<label>ADMIN TOKEN</label><input id="token" type="password" placeholder="Enter your ADMIN_TOKEN">
<button id="connect" type="button">Connect</button>
<p id="status" class="muted">Enter your admin token and connect first.</p>
<form id="f" style="display:none">
<div class="grid">
<div><label>AMAZON LINK *</label><input id="url" required placeholder="https://www.amazon.com/dp/B0..."></div>
<div><label>TITLE</label><input id="title" placeholder="Product title"></div>
<div><label>PRICE</label><input id="price" placeholder="$299"></div>
<div><label>IMAGE URL</label><input id="img" placeholder="https://..."></div>
<div><label>BADGE</label><select id="badge"><option>Best Overall</option><option>Best Value</option><option>Best Rated</option><option>Premium Pick</option><option>Style Of Life Pick</option></select></div>
</div>
<label>CUSTOMER ADVANTAGES — one per line</label>
<textarea id="adv" placeholder="Elegant everyday style&#10;Great gift choice&#10;Lightweight design"></textarea>
<button id="add" type="submit">Add Product</button>
</form>
</div>
<div class="items" id="items"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
function base(){
  return ($("apiBase").value.trim() || location.origin).replace(/\/+$/,"");
}
function headers(){return {"x-admin-token":$("token").value};}
async function load(){
  $("status").className="muted";
  $("status").textContent="Connecting...";
  try{
    const r=await fetch(base()+"/api/admin/products",{headers:headers()});
    const d=await r.json().catch(()=>({error:"Backend returned an invalid response."}));
    if(!r.ok) throw new Error(d.error||("Backend error "+r.status));
    $("status").className="ok";
    $("status").textContent="Connected. "+(d.products||[]).length+" products in database.";
    $("f").style.display="block";
    $("items").innerHTML=(d.products||[]).map(p=>`
      <div class="item">
        ${p.image_url?`<img class="pic" src="${esc(p.image_url)}">`:`<div class="pic"></div>`}
        <div>
          <div class="badge">${esc(p.badge)} · ${p.active?"LIVE":"HIDDEN"}</div>
          <div class="title">${esc(p.title)}</div>
          <div>${esc(p.price)}</div>
          <div class="muted">${(p.advantages||[]).map(x=>"✓ "+esc(x)).join("<br>")}</div>
          <button type="button" onclick="toggleProduct('${p.id}',${!p.active})">${p.active?"Hide":"Show"}</button>
          <button type="button" class="danger" onclick="deleteProduct('${p.id}')">Delete</button>
        </div>
      </div>`).join("");
  }catch(err){
    $("f").style.display="none";
    $("status").className="err";
    $("status").textContent="Connection failed: "+err.message;
  }
}
$("connect").onclick=async()=>{
  localStorage.setItem("sol_admin_token",$("token").value);
  localStorage.setItem("sol_api_base",$("apiBase").value.trim());
  await load();
};
$("apiBase").value=localStorage.getItem("sol_api_base")||"";
$("token").value=localStorage.getItem("sol_admin_token")||"";

$("f").onsubmit=async e=>{
  e.preventDefault();
  const btn=$("add"); btn.disabled=true;
  $("status").className="muted"; $("status").textContent="Saving product...";
  try{
    const body={
      amazonUrl:$("url").value.trim(),
      title:$("title").value.trim(),
      price:$("price").value.trim(),
      imageUrl:$("img").value.trim(),
      badge:$("badge").value,
      advantages:$("adv").value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean)
    };
    const r=await fetch(base()+"/api/admin/products",{
      method:"POST",
      headers:{"Content-Type":"application/json",...headers()},
      body:JSON.stringify(body)
    });
    const d=await r.json().catch(()=>({error:"Backend returned an invalid response."}));
    if(!r.ok) throw new Error(d.error||("Backend error "+r.status));
    $("f").reset();
    $("status").className="ok";
    $("status").textContent="Product added successfully to Supabase.";
    await load();
  }catch(err){
    $("status").className="err";
    $("status").textContent="Add failed: "+err.message;
  }finally{btn.disabled=false;}
};

async function toggleProduct(id,active){
  await fetch(base()+"/api/admin/products/"+id,{
    method:"PATCH",headers:{"Content-Type":"application/json",...headers()},
    body:JSON.stringify({active})
  }); load();
}
async function deleteProduct(id){
  if(!confirm("Delete this product?")) return;
  await fetch(base()+"/api/admin/products/"+id,{method:"DELETE",headers:headers()});
  load();
}
if($("token").value && $("apiBase").value) load();
</script></body></html>
